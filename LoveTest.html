<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Question Quiz Maker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 mt-4 md:mt-10 mb-10">
        <header class="text-center mb-6">
            <h1 id="page-title" class="text-2xl font-bold text-gray-800">📝 LOVE TEST​</h1>
            <p id="page-subtitle" class="text-sm text-gray-500 mt-1">Create multiple questions and send them to your partner❤️‍🩹​!</p>
        </header>

        <div id="creator-section" class="space-y-6">
            
            <div id="questions-builder-list" class="space-y-6">
                </div>

            <div class="flex space-x-3 pt-2">
                <button onclick="addQuestionBlock()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm shadow-sm cursor-pointer text-center">
                    ➕ Add Question
                </button>
                <button onclick="generateQuizLink()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm shadow-md cursor-pointer text-center">
                    🚀 Generate Link
                </button>
            </div>

            <div id="link-container" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-xl space-y-2">
                <p class="text-xs text-green-800 font-semibold">✨ Quiz Ready! Copy link and send to your friend:</p>
                <div class="flex space-x-2">
                    <input type="text" id="share-url" readonly class="w-full p-2.5 bg-white border border-gray-300 rounded-lg text-xs focus:outline-none text-gray-600">
                    <button onclick="copyLink()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-medium cursor-pointer transition">Copy</button>
                </div>
                <p id="copy-status" class="text-[11px] text-green-600 font-bold hidden">Copied to clipboard!</p>
            </div>
        </div>

        <div id="taker-section" class="hidden space-y-4">
            <div class="flex justify-between items-center text-xs text-gray-500 font-medium px-1">
                <span id="question-counter">Question 1 of 1</span>
                <span id="score-counter" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">Score: 0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-1.5">
                <div id="progress-bar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl mt-2">
                <p id="display-question" class="text-gray-800 font-semibold text-base break-words"></p>
            </div>

            <div id="display-options" class="space-y-3 pt-2">
                </div>

            <button onclick="submitCurrentAnswer()" id="next-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-md text-sm mt-4 cursor-pointer">
                Submit & Next
            </button>
        </div>

        <div id="result-section" class="hidden text-center py-8 space-y-4">
            <div class="inline-flex p-5 rounded-full bg-indigo-50 text-indigo-600 mb-2">
                <span class="text-5xl">🏆</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Quiz Completed!</h2>
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 inline-block min-w-[160px]">
                <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Final Score</p>
                <p id="score-text" class="text-4xl font-extrabold text-indigo-600 mt-1">0 / 0</p>
            </div>
            <p id="feedback-text" class="text-sm text-gray-500 px-4"></p>
            
            <hr class="border-gray-200 my-4">
            <button onclick="resetToCreator()" class="text-xs text-indigo-600 hover:underline font-semibold cursor-pointer">
                Want to build your own custom quiz? Click here
            </button>
        </div>

    </div>

    <script>
        // Trackers for current runtime actions
        let questionCount = 0; 
        let quizPayloadData = []; // Array storing loaded shared quiz objects
        let currentQuestionIndex = 0;
        let totalScore = 0;

        // Initialize App State
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const encryptedPayload = urlParams.get('q');

            if (encryptedPayload) {
                try {
                    // Decode structural quiz content directly from compressed URL state
                    quizPayloadData = JSON.parse(decodeURIComponent(escape(atob(encryptedPayload))));
                    if(Array.isArray(quizPayloadData) && quizPayloadData.length > 0) {
                        startQuizTakerMode();
                    } else {
                        throw new Error("Invalid format");
                    }
                } catch (e) {
                    alert("The quiz URL appears broken or corrupted.");
                    resetToCreator();
                }
            } else {
                // Initialize default first blank block in creator mode
                addQuestionBlock();
            }
        });

        // --- CREATOR DOM IMPLEMENTATIONS ---
        function addQuestionBlock() {
            questionCount++;
            const container = document.getElementById('questions-builder-list');
            
            const block = document.createElement('div');
            block.id = `q-block-${questionCount}`;
            block.className = "p-4 bg-gray-50 border border-gray-200 rounded-xl space-y-3 relative shadow-xs";
            
            block.innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-200 pb-2 mb-1">
                    <span class="text-xs font-bold text-indigo-600 tracking-wide uppercase">Question #${questionCount}</span>
                    ${questionCount > 1 ? `<button onclick="removeQuestionBlock(${questionCount})" class="text-xs text-red-500 hover:text-red-700 font-medium cursor-pointer">Delete</button>` : ''}
                </div>
                <div>
                    <textarea class="quiz-q-input w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" rows="2" placeholder="Write your question here..."></textarea>
                </div>
                <div class="space-y-2">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-tight">Options (Select the correct one)</p>
                    ${[0,1,2,3].map(i => `
                        <div class="flex items-center space-x-2 bg-white p-2 rounded-lg border border-gray-200">
                            <input type="radio" name="correct-opt-${questionCount}" value="${i}" ${i === 0 ? 'checked' : ''} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                            <input type="text" class="opt-input-${i} w-full bg-transparent text-sm px-1 focus:outline-none" placeholder="Option ${String.fromCharCode(65 + i)}">
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(block);
        }

        function removeQuestionBlock(id) {
            const block = document.getElementById(`q-block-${id}`);
            if(block) block.remove();
            reindexQuestionLabels();
        }

        function reindexQuestionLabels() {
            const blocks = document.getElementById('questions-builder-list').children;
            questionCount = 0;
            Array.from(blocks).forEach((block) => {
                questionCount++;
                // Retain specific inner fields configuration values but re-align identifiers
                const oldRadioName = block.querySelector('input[type="radio"]').name;
                block.id = `q-block-${questionCount}`;
                block.querySelector('span').innerText = `Question #${questionCount}`;
                
                block.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.name = `correct-opt-${questionCount}`;
                });
                
                const deleteBtn = block.querySelector('button');
                if(deleteBtn) {
                    deleteBtn.setAttribute('onclick', `removeQuestionBlock(${questionCount})`);
                }
            });
        }

        function generateQuizLink() {
            const blocks = document.getElementById('questions-builder-list').children;
            const compiledQuiz = [];

            for (let i = 0; i < blocks.length; i++) {
                const block = blocks[i];
                const questionText = block.querySelector('.quiz-q-input').value.trim();
                
                const options = [
                    block.querySelector('.opt-input-0').value.trim(),
                    block.querySelector('.opt-input-1').value.trim(),
                    block.querySelector('.opt-input-2').value.trim(),
                    block.querySelector('.opt-input-3').value.trim()
                ];
                
                const relativeRadioName = block.querySelector('input[type="radio"]').name;
                const correctSelection = block.querySelector(`input[name="${relativeRadioName}"]:checked`).value;

                // Enforce mandatory structural properties validation
                if (!questionText || options.some(str => str === "")) {
                    alert(`Please complete all entries for Question #${i+1}.`);
                    return;
                }

                compiledQuiz.push({
                    q: questionText,
                    o: options,
                    c: parseInt(correctSelection)
                });
            }

            // Transform state structure directly into URL parameters safe data strings payload 
            const base64Encoded = btoa(unescape(encodeURIComponent(JSON.stringify(compiledQuiz))));
            const shareUrl = `${window.location.origin}${window.location.pathname}?q=${base64Encoded}`;

            document.getElementById('share-url').value = shareUrl;
            document.getElementById('link-container').classList.remove('hidden');
            document.getElementById('link-container').scrollIntoView({ behavior: 'smooth' });
        }

        function copyLink() {
            const inputField = document.getElementById('share-url');
            inputField.select();
            inputField.setSelectionRange(0, 99999); // Mobile compatibility constraint fallback
            navigator.clipboard.writeText(inputField.value);

            const status = document.getElementById('copy-status');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 2000);
        }

        // --- TAKER LOGIC (One-by-One Presentation) ---
        function startQuizTakerMode() {
            // Screen structural interface transformations
            document.getElementById('page-title').innerText = "🎯 Take the Quiz";
            document.getElementById('page-subtitle').innerText = "Answer all questions to see your final score!";
            document.getElementById('creator-section').classList.add('hidden');
            document.getElementById('taker-section').classList.remove('hidden');
            
            currentQuestionIndex = 0;
            totalScore = 0;
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const currentQuestion = quizPayloadData[currentQuestionIndex];
            
            // Re-render contextual pagination state components
            document.getElementById('question-counter').innerText = `Question ${currentQuestionIndex + 1} of ${quizPayloadData.length}`;
            document.getElementById('score-counter').innerText = `Score: ${totalScore}`;
            
            const progressPercent = ((currentQuestionIndex) / quizPayloadData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Display title string
            document.getElementById('display-question').innerText = currentQuestion.q;

            // Generate structured single select options list UI 
            const optionsBox = document.getElementById('display-options');
            optionsBox.innerHTML = '';

            currentQuestion.o.forEach((text, idx) => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-3 p-3 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-indigo-50/60 active:scale-[0.99] transition";
                label.innerHTML = `
                    <input type="radio" name="taker-selected-option" value="${idx}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                    <span class="text-sm font-medium text-gray-700">${text}</span>
                `;
                optionsBox.appendChild(label);
            });

            // Adjust button naming convention for terminal actions visibility context
            if (currentQuestionIndex === quizPayloadData.length - 1) {
                document.getElementById('next-btn').innerText = "Submit & View Final Score";
            } else {
                document.getElementById('next-btn').innerText = "Submit & Next";
            }
        }

        function submitCurrentAnswer() {
            const choiceChecked = document.querySelector('input[name="taker-selected-option"]:checked');
            if(!choiceChecked) {
                alert("Please pick an option to proceed!");
                return;
            }

            const chosenAnswerIdx = parseInt(choiceChecked.value);
            const validationTargetObj = quizPayloadData[currentQuestionIndex];

            // Evaluate system scoring parameters rule configurations (+1 for correct, 0 for wrong)
            if(chosenAnswerIdx === validationTargetObj.c) {
                totalScore += 1;
            }

            // State step navigation mapping sequence tracking check
            if (currentQuestionIndex < quizPayloadData.length - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('taker-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            document.getElementById('score-text').innerText = `${totalScore} / ${quizPayloadData.length}`;
            
            // Context-aware dynamic grading responses
            const performanceRatio = totalScore / quizPayloadData.length;
            let reviewString = "";
            if (performanceRatio === 1) {
                reviewString = "Perfect score! Outstanding job.";
            } else if (performanceRatio >= 0.5) {
                reviewString = "Nicely done! You got more than half right.";
            } else {
                reviewString = "Better luck next time! Keep practicing.";
            }
            document.getElementById('feedback-text').innerText = reviewString;
        }

        function resetToCreator() {
            // Wipe standard tracking query values back to standard origin
            window.location.href = window.location.pathname;
        }
    </script>
</body>
</html>
