<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Test Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 mt-4 md:mt-10 mb-10">
        <header class="text-center mb-6">
            <h1 id="page-title" class="text-2xl font-bold text-gray-800">📝 LOVE TEST</h1>
            <p id="page-subtitle" class="text-sm text-gray-500 mt-1">Create questions and test your partner!</p>
        </header>

        <div id="creator-section" class="space-y-6">
            <div id="questions-builder-list" class="space-y-6"></div>
            <div class="flex space-x-3 pt-2">
                <button onclick="addQuestionBlock()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm shadow-sm cursor-pointer">➕ Add Question</button>
                <button onclick="generateQuizLink()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm shadow-md cursor-pointer">🚀 Generate Link</button>
            </div>
            <div id="link-container" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-xl space-y-2">
                <p class="text-xs text-green-800 font-bold">Share this link:</p>
                <input type="text" id="share-url" readonly class="w-full p-2.5 bg-white border border-gray-300 rounded-lg text-xs">
                <button onclick="copyLink()" class="w-full bg-green-600 text-white py-2 rounded-lg text-xs font-bold cursor-pointer">Copy Link</button>
            </div>
        </div>

        <div id="taker-section" class="hidden space-y-4">
            <div class="flex justify-between text-xs text-gray-500 font-medium px-1">
                <span id="question-counter"></span>
                <span id="score-counter">Score: 0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-1.5"><div id="progress-bar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div></div>
            <div class="bg-indigo-50 border border-gray-300 p-4 rounded-xl"><p id="display-question" class="text-gray-800 font-semibold"></p></div>
            <div id="display-options" class="space-y-3 pt-2"></div>
            <button onclick="submitCurrentAnswer()" id="next-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm mt-4 cursor-pointer">Submit & Next</button>
        </div>

        <div id="result-section" class="hidden text-center py-8 space-y-4">
            <h2 class="text-2xl font-bold text-gray-800">Quiz Completed!</h2>
            <p id="score-text" class="text-4xl font-extrabold text-indigo-600"></p>
            <p id="feedback-text" class="text-sm text-gray-500"></p>
            <div id="answers-review" class="text-left mt-6 space-y-4 text-sm"></div>
            <button onclick="resetToCreator()" class="text-xs text-indigo-600 hover:underline mt-6 block w-full">Create a new quiz</button>
        </div>
    </div>

    <script>
        let questionCount = 0, quizPayloadData = [], currentQuestionIndex = 0, totalScore = 0;
        let userAnswers = [];

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const encryptedPayload = urlParams.get('q');
            if (encryptedPayload) {
                try {
                    quizPayloadData = JSON.parse(atob(encryptedPayload));
                    startQuizTakerMode();
                } catch(e) { alert("Invalid link"); resetToCreator(); }
            } else { addQuestionBlock(); }
        });

        function addQuestionBlock() {
            questionCount++;
            const container = document.getElementById('questions-builder-list');
            
            const block = document.createElement('div');
            block.id = `q-block-${questionCount}`;
            block.className = "p-4 bg-gray-50 border border-gray-200 rounded-xl space-y-3 relative shadow-xs";
            
            block.innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-200 pb-2 mb-1">
                    <span class="text-xs font-bold text-indigo-600 tracking-wide uppercase">Question #${questionCount}</span>
                    ${questionCount > 1 ? `<button onclick="removeQuestionBlock(${questionCount})" class="text-xs text-red-500 hover:text-red-700 font-medium cursor-pointer">Delete</button>` : ''}
                </div>
                <div>
                    <textarea class="quiz-q-input w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" rows="2" placeholder="Write your question here..."></textarea>
                </div>
                <div class="space-y-2">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-tight">Options (Select the correct one)</p>
                    ${[0,1,2,3].map(i => `
                        <div class="flex items-center space-x-2 bg-white p-2 rounded-lg border border-gray-200">
                            <input type="radio" name="correct-opt-${questionCount}" value="${i}" ${i === 0 ? 'checked' : ''} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                            <input type="text" class="opt-input-${i} w-full bg-transparent text-sm px-1 focus:outline-none" placeholder="Option ${String.fromCharCode(65 + i)}">
                        </div>
                    `).join('')}
                </div>

            `;
            container.appendChild(block);
        }

        function generateQuizLink() {
            const blocks = document.querySelectorAll('#questions-builder-list > div');
            const compiledQuiz = Array.from(blocks).map(block => ({
                q: block.querySelector('.quiz-q-input').value,
                o: [0,1,2,3].map(i => block.querySelector(`.opt-input-${i}`).value),
                c: parseInt(block.querySelector('input[type="radio"]:checked').value)
            }));
            const base64Encoded = btoa(JSON.stringify(compiledQuiz));
            document.getElementById('share-url').value = `${window.location.origin}${window.location.pathname}?q=${base64Encoded}`;
            document.getElementById('link-container').classList.remove('hidden');
        }

        function startQuizTakerMode() {
            document.getElementById('creator-section').classList.add('hidden');
            document.getElementById('taker-section').classList.remove('hidden');
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const q = quizPayloadData[currentQuestionIndex];
            document.getElementById('display-question').innerText = q.q;
            document.getElementById('question-counter').innerText = `Question ${currentQuestionIndex + 1} / ${quizPayloadData.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / quizPayloadData.length) * 100}%`;
            const optionsBox = document.getElementById('display-options');
            optionsBox.innerHTML = '';
            q.o.forEach((text, idx) => {
                optionsBox.innerHTML += `<label class="flex items-center space-x-3 p-3 bg-white border border-gray-300 rounded-xl cursor-pointer hover:bg-indigo-50"><input type="radio" name="taker-sel" value="${idx}"> <span class="text-sm">${text}</span></label>`;
            });
        }

        function submitCurrentAnswer() {
            const choice = document.querySelector('input[name="taker-sel"]:checked');
            if(!choice) return alert("Select an option!");
            
            const idx = parseInt(choice.value);
            userAnswers.push(idx);
            if(idx === quizPayloadData[currentQuestionIndex].c) totalScore++;
            
            if(currentQuestionIndex < quizPayloadData.length - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('taker-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('score-text').innerText = `${totalScore} / ${quizPayloadData.length}`;
            
            const reviewDiv = document.getElementById('answers-review');
            quizPayloadData.forEach((item, i) => {
                const isCorrect = userAnswers[i] === item.c;
                reviewDiv.innerHTML += `
                    <div class="p-3 rounded-lg border border-gray-300 ${isCorrect ? 'bg-green-50' : 'bg-red-50'}">
                        <p class="font-bold text-gray-800">${item.q}</p>
                        <p class="text-xs">Your choice: <span class="font-semibold">${item.o[userAnswers[i]]}</span></p>
                        ${!isCorrect ? `<p class="text-xs text-green-700 font-bold">Correct: ${item.o[item.c]}</p>` : ''}
                    </div>`;
            });
        }

        function resetToCreator() { window.location.href = window.location.pathname; }
        function copyLink() { navigator.clipboard.writeText(document.getElementById('share-url').value); alert("Link copied!"); }
    </script>
</body>
</html>
